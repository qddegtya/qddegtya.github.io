# Colorful theme data - content type to dopamine hue mapping.
# Single source consumed by templates so hues stay consistent site-wide.
hues:
  writing:  "#FF5A6E"   # coral
  projects: "#FF9F45"   # amber
  reading:  "#22C58B"   # spring green
  travel:   "#2BA9F4"   # sky
  codeart:  "#6E76FF"   # iris

# Primary navigation - shared by the floating nav and the mobile menu on every
# page. hue is the key into `hues` above (the moving colour block on hover).
# Primary navigation - the top-level menu. Collections (Reading/Travel/Code&Art)
# are intentionally NOT here: they live in the home page's "A colorful world"
# section, so listing them again in the nav would be redundant. Home is rendered
# first by the nav include; these follow. hue is the key into `hues` above.
nav:
  - { label: "Blog",       url: "/posts/",      hue: writing  }
  - { label: "Guestbook",  url: "/guestbook/",  hue: reading  }
  - { label: "Projects",   url: "/projects/",   hue: projects }
  - { label: "Archive",    url: "/year-archive/", hue: codeart }

# Site footer - shared by home and every inner page.
footer:
  tagline: "Still the restless kid, still shipping."
  sign: "Archer"
  columns:
    - head: "Content"
      links:
        - { label: "Writing", url: "/posts/" }
        - { label: "Projects", url: "/projects/" }
        - { label: "Code & Art", url: "/ca/" }
        - { label: "Archive", url: "/year-archive/" }
    - head: "Elsewhere"
      links:
        - { label: "GitHub", url: "https://github.com/qddegtya", me: true }
        - { label: "Twitter", url: "https://twitter.com/qddegtya", me: true }
        - { label: "Digital Garden", url: "https://www.yuque.com/chiyu-heb0t", me: true }

